<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5B61F6"><title>إدارة مهامي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar"><div class="brand"><div class="brand-mark">✓</div><div><strong>إدارة مهامي</strong><span>Task Manager</span></div></div>
<nav><button class="nav-item active" data-view="today">📋 <span>مهامي</span></button><button class="nav-item" data-view="history">📅 <span>السجل</span></button></nav>
</aside>
<main class="main">
<header class="topbar"><div><p class="eyebrow" id="dateLabel"></p><h1>مهامي اليوم</h1></div><div class="avatar">Y</div></header>
<section id="todayView" class="view active-view">
<section class="hero-card"><p class="eyebrow light">إدارة المهام</p><h2>ما الذي تريد إنجازه اليوم؟</h2><p class="light-muted">اكتب مهامك أو تحدث، وسنضعها في قائمتك.</p>
<textarea id="planInput" rows="3" placeholder="مثال: دراسة الإنجليزية، إنهاء المشروع، قراءة 20 دقيقة..."></textarea>
<div class="input-actions"><button class="secondary-btn" id="voiceBtn">🎙️ تحدث</button><button class="primary-btn" id="planBtn">＋ إضافة المهام</button></div></section>
<section class="progress-card"><div class="section-head"><div><p class="eyebrow">التقدم</p><h3 id="progressText">0 / 0 مكتملة</h3></div><div class="progress-ring"><span id="progressPct">0%</span></div></div><div class="progress-bar"><span id="progressBar"></span></div><p class="muted" id="progressHint">أضف أول مهمة للبدء.</p></section>
<section class="content-card"><div class="section-head"><div><p class="eyebrow">قائمة المهام</p><h3>مهامي</h3></div><button class="ghost-btn" id="addTaskBtn">＋ مهمة جديدة</button></div><div id="taskList" class="task-list"></div></section>
</section>
<section id="historyView" class="view"><div class="content-card"><p class="eyebrow">السجل</p><h2>الأيام السابقة</h2><div id="historyList"></div></div></section>
</main></div>
<script src="task-manager.js"></script>
<script>
const dateLabel=document.getElementById('dateLabel');dateLabel.textContent=new Intl.DateTimeFormat('ar',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(new Date());
document.querySelectorAll('.nav-item').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('active-view'));document.getElementById(btn.dataset.view+'View').classList.add('active-view');document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));btn.classList.add('active');}));
</script>
</body></html>
